<body>
<header class="top"><div class="topline"><div class="brand"><span class="brand-icon" aria-hidden="true">🏗️</span><h1>Калькулятор<br>для стройки</h1></div><button class="iconbtn" id="themeBtn" type="button" aria-label="Переключить тему" title="Светлая / тёмная тема">☼</button></div><p>Расчёт материалов и сметы для вашего дома</p></header>
<main><div class="section-title">Выберите расчёт</div><nav class="tabs" id="tabs" aria-label="Разделы калькулятора"></nav><div id="app" aria-live="polite"></div></main>
<div class="footer-note"><div class="note">Расчёты предварительные и не заменяют проект, обследование грунта, конструктивный расчёт или смету подрядчика. Перед закупкой проверьте размеры, единицы, паспорт материала, запасы и местные нормы.</div><div id="testBox" hidden><button class="btn" id="runTests" type="button">Проверить контрольные формулы</button><div id="testReport" class="note" role="status"></div></div></div>
<script>
const $=s=>document.querySelector(s),ce=x=>Math.ceil(x-1e-9);
const f=(x,d=2)=>x.toLocaleString('ru-RU',{maximumFractionDigits:d});
const num=x=>{
  const s=String(x).trim().replace(',','.');
  if(s==='' || !/^(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)) return NaN;
  const n=Number(s);
  return Number.isFinite(n)&&n>=0?n:NaN;
};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const ld=(k,d)=>{try{const x=JSON.parse(localStorage.getItem(k));return x==null?d:x}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const N=(id,l,v,u,w)=>({id,l,v,u,w}),S=(id,l,o,v,w)=>({id,l,o,v,w}),R=(l,v,u,d=2,m)=>({l,v,u,d,m});
const ST=['Фундамент','Стены','Кровля','Отделка','Инженерия','Участок','Другое'];

const T=[
{k:'house',n:'Дом',st:'Другое',f:[N('l','Длина дома',10,'м'),N('w','Ширина дома',8,'м'),N('h','Высота стен',2.7,'м'),N('o','Проёмы (окна, двери)',12,'м²'),N('a','Угол ската крыши',30,'°')],
 c:g=>[R('Периметр',2*(g.l+g.w),'м',1),R('Площадь стен нетто',Math.max(0,2*(g.l+g.w)*g.h-g.o),'м²',1),R('Площадь застройки',g.l*g.w,'м²',1),R('Объём дома',g.l*g.w*g.h,'м³',1)],
 note:'Введите размеры один раз. На вкладках расчётов появится кнопка «Подставить из размеров дома», она заполнит длину, периметр, высоту, проёмы и угол крыши.'},
{k:'concrete',n:'Бетон',st:'Фундамент',f:[
 S('t','Что заливаем',[['s','Ленточный фундамент'],['p','Плита / стяжка'],['c','Столбики (круглые)']],'s'),
 N('l','Длина ленты',30,'м',g=>g.t=='s'),N('w','Ширина',.4,'м',g=>g.t=='s'),N('h','Высота',.8,'м',g=>g.t=='s'),
 N('pl','Длина',6,'м',g=>g.t=='p'),N('pw','Ширина',4,'м',g=>g.t=='p'),N('pt','Толщина',.2,'м',g=>g.t=='p'),
 N('cn','Количество',12,'шт',g=>g.t=='c'),N('cd','Диаметр',.3,'м',g=>g.t=='c'),N('ch','Глубина',1.5,'м',g=>g.t=='c'),
 N('z','Запас',10,'%')],
 c:g=>{let v=g.t=='s'?g.l*g.w*g.h:g.t=='p'?g.pl*g.pw*g.pt:g.cn*Math.PI*(g.cd/2)**2*g.ch;v*=1+g.z/100;const c=v*290;
  return[R('Бетон',v,'м³',2,1),R('Цемент',c,'кг',0),R('Мешков по 50 кг',ce(c/50),'шт',0),R('Песок',v*780,'кг',0),R('Щебень',v*1080,'кг',0),R('Вода',v*190,'л',0)]},
 note:'Объём геометрический, запас добавляется отдельно. Расход цемента, песка, щебня и воды — грубая справочная оценка, не рецептура бетона: состав назначают по требуемому классу, заполнителям и условиям эксплуатации. Глубину заложения определяют по грунтам, промерзанию и проекту.'},
{k:'rebar',n:'Арматура',st:'Фундамент',f:[
 N('l','Длина ленты',30,'м'),N('w','Ширина',.4,'м'),N('h','Высота',.8,'м'),N('n','Прутков продольно',4,'шт'),
 S('d','Продольная, мм',[['0.617','10'],['0.888','12'],['1.21','14']],'0.888'),N('s','Шаг хомутов',.4,'м'),S('sd','Диаметр хомутов, мм',[['0.395','8'],['0.617','10']],'0.395'),N('cv','Защитный слой',50,'мм'),N('hk','Запас на загибы хомута',200,'мм')],
 c:g=>{if(!(g.s>0&&g.l>0&&g.w>0&&g.h>0&&g.n>0))return[];const lon=g.l*g.n*1.1,cnt=ce(g.l/g.s)+1;
  const cover=2*(g.cv||50)/1000,hook=(g.hk||200)/1000,wi=g.w-cover,hi=g.h-cover,stLen=Math.max(0,2*(wi+hi)+hook),st=cnt*stLen;
  const longKg=lon*num(g.d),stKg=st*num(g.sd||'0.395');
  return[R('Продольная арматура с запасом 10%',lon,'м',1,1),R('Прутков по 11,7 м',ce(lon/11.7),'шт',0),R('Хомутов Ø'+(num(g.sd||'0.395')>.5?'10':'8'),cnt,'шт',0),R('Длина одного хомута (оценка)',stLen,'м',2),R('Арматура на хомуты Ø'+(num(g.sd||'0.395')>.5?'10':'8'),st,'м',1),R('Вес продольной арматуры',longKg,'кг',1),R('Вес хомутов Ø'+(num(g.sd||'0.395')>.5?'10':'8')+' (оценка)',stKg,'кг',1),R('Общий вес арматуры',longKg+stKg,'кг',1)]},
 note:'Предварительная оценка: защитный слой и запас на загибы можно менять; длина хомута считается по прямоугольному контуру. Вес погонного метра принят 0,395 кг/м для Ø8 или 0,617 кг/м для Ø10. Продольный запас 10% не заменяет расчёт анкеровки, нахлёстов и Г-/П-образных элементов в углах и пересечениях. Геометрия хомутов упрощена; диаметр, число стержней, шаг и защитный слой должны соответствовать проекту и нормам.'},
{k:'blocks',n:'Газоблок',st:'Стены',f:[
 N('p','Периметр стен',36,'м'),N('h','Высота',2.7,'м'),N('o','Проёмы',8,'м²'),N('th','Толщина стены',300,'мм'),
 N('bl','Длина блока',625,'мм'),N('bh','Высота блока',250,'мм'),N('z','Запас',5,'%')],
 c:g=>{const a=Math.max(0,g.p*g.h-g.o),b=g.bl*g.bh/1e6;if(!b)return[];const v=a*g.th/1000;
  return[R('Блоков',ce(a/b*(1+g.z/100)),'шт',0,1),R('Площадь кладки',a,'м²'),R('Объём кладки',v,'м³'),R('Клей (~25 кг/м³)',v*25,'кг',0)]},
 note:'Газобетон 625×250, пеноблок 600×200, кладка на клей. Армопояс и перемычки не учтены. Для кирпича есть отдельная вкладка.'},
{k:'brick',n:'Кирпич / печь',st:'Стены',f:[
 S('m','Что кладём',[['w','Стена'],['s','Печь / массив']],'w'),
 S('t','Кирпич',[['s','Одинарный 250×120×65'],['e','Евро 250×120×88']],'s'),
 N('p','Длина стены',10,'м',g=>g.m=='w'),N('h','Высота',2.5,'м',g=>g.m=='w'),
 S('th','Толщина, в кирпичах',[['0.5','0,5 (120 мм)'],['1','1 (250 мм)'],['1.5','1,5'],['2','2']],'1',g=>g.m=='w'),N('o','Проёмы',4,'м²',g=>g.m=='w'),
 N('a','Длина',1,'м',g=>g.m=='s'),N('b','Ширина',.7,'м',g=>g.m=='s'),N('c','Высота',2,'м',g=>g.m=='s'),N('k','Заполнение',55,'%',g=>g.m=='s'),
 N('z','Запас',5,'%')],
 c:g=>{const s=g.t=='s';let q,v;
  if(g.m=='w'){const a=Math.max(0,g.p*g.h-g.o),th=num(g.th);q=a*(s?102:78)*th;v=a*(th==.5?.12:th*.255)}
  else{v=g.a*g.b*g.c*g.k/100;q=v*(s?394:302)}
  return[R('Кирпичей',ce(q*(1+g.z/100)),'шт',0,1),R('Объём кладки',v,'м³'),R('Раствор',v*(s?.23:.2),'м³')]},
 note:'Шов принят 10 мм; нормы расхода ориентировочные и зависят от формата, шва и перевязки. Для печи расчёт только предварительный: количество и огнеупорные материалы определяют по порядовке и проекту.'},
{k:'roof',n:'Кровля',st:'Кровля',f:[
 S('t','Тип крыши',[['g','Двускатная'],['s','Односкатная'],['h','Вальмовая (4 ската)']],'g'),
 N('l','Длина дома',8,'м'),N('w','Ширина дома',6,'м'),N('o','Свес',.5,'м'),N('a','Угол ската',30,'°'),N('s','Полезная ширина листа',1.1,'м')],
 c:g=>{const a=g.a*Math.PI/180,co=Math.cos(a);if(!(g.l>0&&g.w>0&&g.o>=0&&g.a>0&&g.a<75&&co>0&&g.s>0))return[];const L=g.l+2*g.o,W=g.w+2*g.o,ta=Math.tan(a);let sl=0,A,h;
  if(g.t=='g'){sl=(g.w/2+g.o)/co;A=2*sl*L;h=g.w/2*ta}
  else if(g.t=='s'){sl=(g.w+2*g.o)/co;A=sl*L;h=g.w*ta}
  else{A=L*W/co;h=Math.min(g.l,g.w)/2*ta}
  const r=[R('Площадь кровли',A,'м²',1,1)];
  if(sl){r.push(R('Длина ската',sl,'м',2),R('Листов на один скат по полезной ширине',ce(L/g.s),'шт',0));if(g.t=='g')r.push(R('Листов на оба ската (оценка)',2*ce(L/g.s),'шт',0));else r.push(R('Листов на односкатную кровлю (оценка)',ce(L/g.s),'шт',0))}
  r.push(R(g.t=='g'?'Высота конька над стеной':'Высота подъёма над стеной',h,'м',2),R('Площадь с запасом 10%',A*1.1,'м²',1),R('Плёнки с нахлёстом 15%',A*1.15,'м²',1));return r},
 note:'Геометрическая предварительная оценка. Для двускатной и односкатной крыши число листов считается по полезной ширине вдоль длины карниза; нахлёсты и раскрой могут увеличить количество. Для вальмовой крыши площадь считается по прямоугольной проекции с учётом свесов, делённой на cos угла, но листы нужно раскладывать отдельно по каждому скату. Высота подъёма указана над уровнем стен, без учёта конструкции конька. Проверяйте минимальный уклон, снеговую/ветровую нагрузку, крепёж и ограничения длины листа по проекту и документации покрытия.'},
{k:'lumber',n:'Пиломатериал',st:'Стены',f:[
 S('m','Что считаем',[['f','Каркас стен'],['r','Стропила']],'f'),
 N('fl','Длина всех стен',28,'м',g=>g.m=='f'),N('fh','Высота',2.5,'м',g=>g.m=='f'),N('fs','Шаг стоек',.6,'м',g=>g.m=='f'),N('fo','Проёмов',6,'шт',g=>g.m=='f'),
 N('rl','Длина дома',8,'м',g=>g.m=='r'),N('rc','Длина стропилины',4,'м',g=>g.m=='r'),N('rs','Шаг стропил',.8,'м',g=>g.m=='r'),
 N('a','Сечение: ширина',50,'мм'),N('b','Высота',150,'мм'),N('ln','Длина доски',6,'м'),N('z','Запас',10,'%')],
 c:g=>{let p,t;
  if(g.m=='f'){if(!g.fs)return[];p=ce(g.fl/g.fs)+1+g.fo*4;t=p*g.fh+3*g.fl}
  else{if(!g.rs)return[];p=2*(ce(g.rl/g.rs)+1);t=p*g.rc}
  t*=1+g.z/100;
  return[R('Объём',t*g.a*g.b/1e6,'м³',3,1),R('Погонных метров',t,'м',0),R('Досок',ce(t/(g.ln||6)),'шт',0),R(g.m=='f'?'Стоек':'Стропил',p,'шт',0)]},
 note:'Каркас: +4 стойки на проём, обвязка в 3 ряда. Не учтены раскосы, перемычки и обрешётка. Сечение подбирают по пролёту и снеговой нагрузке.'},
{k:'insul',n:'Утеплитель',st:'Отделка',f:[N('a','Площадь',60,'м²'),N('t','Толщина',100,'мм'),N('p','В упаковке',5.76,'м²'),N('z','Запас',10,'%')],
 c:g=>{if(!g.p)return[];const A=g.a*(1+g.z/100);return[R('Упаковок',ce(A/g.p),'шт',0,1),R('С запасом',A,'м²',1),R('Объём',A*g.t/1000,'м³')]},
 note:'Площадь в упаковке указана на ней. При утеплении в два слоя считайте каждый слой отдельно.'},
{k:'paint',n:'Краска',st:'Отделка',f:[N('a','Площадь',40,'м²'),N('c','Слоёв',2),N('r','Расход на слой',8,'м²/л'),N('v','Банка',2.5,'л')],
 c:g=>{if(!g.r)return[];const l=g.a*g.c/g.r;return[R('Краски',l,'л',1,1),R('Банок',g.v?ce(l/g.v):0,'шт',0)]},
 note:'Расход смотрите на банке: обычно 6–12 м²/л, для пористых стен меньше.'},
{k:'board',n:'Доска / обшивка',st:'Отделка',f:[N('a','Площадь',30,'м²'),N('w','Ширина доски',120,'мм'),N('l','Длина доски',6,'м'),N('z','Запас',10,'%')],
 c:g=>{const one=g.w/1000*g.l;if(!one)return[];const q=ce(g.a*(1+g.z/100)/one);return[R('Досок',q,'шт',0,1),R('Погонных метров',q*g.l,'м',1)]},
 note:'Для вагонки и террасной доски ширину считайте по рабочей части, без паза.'},
{k:'mix',n:'Клей / смесь',st:'Отделка',f:[
 S('m','Материал',[['1.5','Плиточный клей'],['1.6','Клей для газобетона'],['1.8','Штукатурка гипсовая'],['1.9','Штукатурка цементная'],['2','Пескобетонная стяжка']],'1.5'),
 N('a','Площадь',20,'м²'),N('t','Толщина слоя',5,'мм'),N('b','Мешок',25,'кг'),N('z','Запас',10,'%')],
 c:g=>{if(!g.b)return[];const kg=g.a*g.t*num(g.m)*(1+g.z/100);return[R('Сухой смеси',kg,'кг',0,1),R('Мешков',ce(kg/g.b),'шт',0)]},
 note:'Расход в кг на м² на 1 мм слоя усреднён. Точный указан на упаковке.'},
{k:'dig',n:'Земляные работы',st:'Фундамент',f:[N('l','Длина',30,'м'),N('w','Ширина',.5,'м'),N('d','Глубина',.8,'м'),N('k','Разрыхление',25,'%'),N('v','Объём кузова',10,'м³')],
